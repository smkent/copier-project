project_name:
  type: str
  qmark: 📝
  help: Project (repository) name
  default: '{{ _folder_name }}'
  validator: |
    {%- if not project_name -%}
      Required
    {%- elif project_name | lower | regex_replace('^([a-z0-9]|[a-z0-9][a-z0-9._-]*[a-z0-9])$','') != '' -%}
      {% if template_variant == 'python' -%}
        Python package distribution name
      {%- else -%}
        Project name
      {%- endif %} must only contain letters, numbers, or . - _
    {%- endif -%}

project_description:
  type: str
  qmark: 💬
  help: One-line project summary
  validator: '{% if not project_description %}Required{% endif %}'

project_type:
  type: str
  qmark: 🏗️
  help: Project type
  default: application
  choices:
    - application
    - library

project_visibility:
  type: str
  qmark: 🔒
  help: Project visibility
  default: public
  choices:
    - public
    - private

user_name:
  type: str
  qmark: 🧑
  help: Author's full name
  validator: '{% if not user_name %}Required{% endif %}'

user_email:
  type: str
  qmark: ✉️
  help: Author's email address
  validator: '{% if not user_email %}Required{% endif %}'

github_user:
  type: str
  qmark: 👾
  help: GitHub user or organization name
  when: "{{ project_visibility == 'public' }}"
  validator: '{% if not github_user %}Required{% endif %}'

copyright_holder:
  type: str
  qmark: ©️
  help: Copyright holder's full name
  default: '{{ user_name }}'
  validator: '{% if not copyright_holder %}Required{% endif %}'

copyright_year:
  type: str
  qmark: 📅
  help: The copyright year (e.g. 2026)
  default: "{{ '%Y' | strftime }}"
  validator: |
    {%- if not copyright_year -%}
      Required
    {%- elif copyright_year | regex_replace('^[0-9]{4}$','') != '' -%}
      Invalid year
    {%- endif -%}

copyright_license:
  type: str
  qmark: ⚖️
  help: Project license (GNU "or later" also permits future license versions)
  # Map deprecated GNU SPDX identifiers from existing answers to "-only" ones.
  # Previous answers are only loaded during updates, detected by the presence
  # of an answer to a question asked after this one.
  default: >-
    {%- set previous = (
      _external_data.previous_answers.copyright_license | default('')
      if template_attribution is defined else ''
    ) -%}
    {%- if previous in ['AGPL-3.0', 'GPL-3.0', 'LGPL-3.0'] -%}
      {{ previous }}-only
    {%- else -%}
      {% if project_type == 'library' %}L{% endif %}GPL-3.0-only
    {%- endif -%}
  choices:
    Apache License 2.0: Apache-2.0
    BSD 3-Clause "New" or "Revised" License: BSD-3-Clause
    Creative Commons Attribution 4.0 International: CC-BY-4.0
    Creative Commons Attribution Share Alike 4.0 International: CC-BY-SA-4.0
    Creative Commons Zero v1.0 Universal: CC0-1.0
    GNU Affero General Public License v3.0 only: AGPL-3.0-only
    GNU Affero General Public License v3.0 or later: AGPL-3.0-or-later
    GNU General Public License v3.0 only: GPL-3.0-only
    GNU General Public License v3.0 or later: GPL-3.0-or-later
    GNU Lesser General Public License v3.0 only: LGPL-3.0-only
    GNU Lesser General Public License v3.0 or later: LGPL-3.0-or-later
    ISC License: ISC
    MIT License: MIT

llm_contribution_policy:
  type: str
  qmark: 🤖
  help: LLM contribution policy
  default: accepted-with-disclosure
  choices:
    Accepted: accepted
    Accepted with disclosure: accepted-with-disclosure
    Not accepted: not-accepted

enable_commit_check:
  type: bool
  qmark: 📃
  default: "{{ llm_contribution_policy != 'accepted' }}"
  when: false

template_attribution:
  type: bool
  qmark: 🪧
  help: Add copier-project attribution to README.md?
  default: no
