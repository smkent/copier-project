---
_min_copier_version: '9.5'
_external_data:
  # Previous answers, used to migrate deprecated answer values
  previous_answers: '{{ _copier_conf.answers_file }}'
_preserve_symlinks: true
_skip_if_exists:
  - CHANGELOG.md
_exclude:
  - "{% if _copier_operation == 'update' -%}.mise/conf.d/init.toml{% endif %}"
_subdirectory: '{{ template_variant }}'

_message_after_copy: |
  {{ _copier_conf.dst_path }} is ready! Next steps:

  {% if project_visibility == 'public' %}
  1. Create GitHub repository:
       https://github.com/new?owner={{ github_user }}&name={{ project_name }}

  2. Initialize git and environment:
       mise run init

  3. Push:
       git push -u origin main
  {%- if template_variant == 'python' %}

  For GitHub repository configuration and additional features setup,
  see copier-project's Completing Setup documentation at
  https://smkent.github.io/copier-project/project-setup/
  {%- if enable_docs %}
  OR run the documentation site locally:

       mise run docs

  Then, see One Time Setup at: http://localhost:8000/{{ project_name }}/setup/
  {%- endif -%}
  {%- endif -%}
  {%- elif project_visibility == 'private' -%}
  1. Initialize git and environment:
       mise run init

  2. Push:
       git remote add origin <repo-url>
       git push -u origin main
  {%- endif -%}

_message_after_update: |
  Template update applied. Before committing:

    git diff       # review all changes
    mise install   # install tools, dependencies, git hooks
    mise run lint  # verify code quality
  {%- if template_variant == 'python' %}
    mise run test  # verify tests pass
  {%- endif %}

template_variant:
  type: str
  qmark: 🧬
  help: Project template variant
  default: >-
    {%- if python_version_minimum | default('') -%}
      python
    {%- else -%}
      generic
    {%- endif -%}
  choices:
    Generic: generic
    Python: python
---
!include common/questions/project.yaml
---
!include common/questions/python.yaml
